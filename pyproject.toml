[project]
name = "pycadwork"
version = "0.1.5"
description = "OOP layer over cwapi3d (cadwork 3D Python API)"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Michael Brunner", email = "michael.brunner@cadwork.ch" }]
dependencies = [
    "cwapi3d>=33.264.1",
    "rtree>=1.4.1",
]

[project.optional-dependencies]
cadwork = ["cwapi3d>=33"]            # only inside cadwork's Python
git = ["GitPython>=3.1"]             # the versioning git backend (often absent in cadwork)

[project.urls]
Repository = "https://github.com/Brunner246/pycadwork"

[dependency-groups]
dev = ["pytest>=8.0", "black>=26.5.1", "ruff", "GitPython>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycadwork"]

[tool.hatch.build.targets.sdist]
include = ["src/pycadwork", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py314"
line-length = 100
# A copy-paste-into-the-REPL session: its one-line for/if/comprehension layout is
# intentional (paste line by line), so keep ruff lint + format from reflowing it.
extend-exclude = ["examples/versioning_idle_session.py"]

[tool.ruff.lint]
select = ["E", "F", "W"]   # pycodestyle errors/warnings + pyflakes
