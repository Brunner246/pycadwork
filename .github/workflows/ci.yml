name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install        # reads .python-version (3.14)

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check formatting (black)
        run: uv run black --check --diff .

      - name: Lint (ruff)
        run: uvx ruff check .

      - name: Run tests
        run: uv run pytest

